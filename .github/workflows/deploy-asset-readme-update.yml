name: Plugin Asset/Readme Update

on:
  # Manual only, from the Actions tab. Every run also copies readme.txt to SVN trunk and to the
  # stable tag, which is what the WordPress.org plugin page shows, so an unreleased changelog
  # (= TBA =) on main must never go out on a push.
  workflow_dispatch:

jobs:
  trunk:
    name: Push to trunk
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: WordPress.org Plugin Readme/Assets Update
      uses: 10up/action-wordpress-plugin-asset-update@stable
      env:
        SVN_PASSWORD: ${{ secrets.NAKEDCAT_WPROG_SVN_PASSWORD }}
        SVN_USERNAME: ${{ secrets.NAKEDCAT_WPROG_SVN_USERNAME }}
        SLUG: product-percentage-coupon-woo
        IGNORE_OTHER_FILES: true
